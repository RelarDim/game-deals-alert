name: Build deals page data
on:
  schedule:
    - cron: "17 */3 * * *"   # κάθε 3 ώρες
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_deals.py
      - name: Save data
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add deals.json
          git diff --cached --quiet || (git commit -m "update deals" && git push)
